<text x="350" y="36" text-anchor="middle" font-family="monospace" font-size="20" fill="#6CA6E8">Computer Science Engineer<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.36;0.4;0.95;1" dur="8s" repeatCount="indefinite"/></text>
