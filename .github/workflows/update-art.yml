
name: Update Profile Art

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  update-art:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate contribution heatmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Sourav142005
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import date, timedelta
          from xml.sax.saxutils import escape

          username = os.environ["GITHUB_USERNAME"]
          token = os.environ["GITHUB_TOKEN"]

          query = """
          query($user: String!) {
            user(login: $user) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {"user": username}
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "profile-art-generator"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)

          if result.get("errors"):
              raise RuntimeError(json.dumps(result["errors"]))

          user = result.get("data", {}).get("user")
          if not user:
              raise RuntimeError("GitHub user not found or inaccessible")

          calendar = user["contributionsCollection"]["contributionCalendar"]
          days = [
              day
              for week in calendar["weeks"]
              for day in week["contributionDays"]
          ]

          colors = ["#161b22", "#253B55", "#477DB5", "#6CA6E8", "#A8CCF5"]
          width, height, cell, gap = 980, 150, 11, 4
          start_x, start_y = 12, 32

          svg = [
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{width}" height="{height}" viewBox="0 0 {width} {height}">',
              '<rect width="100%" height="100%" rx="10" fill="#0d1117"/>',
              f'<text x="12" y="20" fill="#6CA6E8" font-family="monospace" '
              f'font-size="12">GITHUB CONTRIBUTIONS // {escape(username)}</text>'
          ]

          for index, day in enumerate(days[-371:]):
              col = index // 7
              row = index % 7
              count = day["contributionCount"]
              level = 0 if count == 0 else min(4, 1 + count // 4)
              x = start_x + col * (cell + gap)
              y = start_y + row * (cell + gap)

              svg.append(
                  f'<rect x="{x}" y="{y}" width="{cell}" height="{cell}" '
                  f'rx="2" fill="{colors[level]}">'
                  f'<title>{escape(day["date"])}: {count} contributions</title>'
                  f'</rect>'
              )

          total = calendar["totalContributions"]
          svg.append(
              f'<text x="12" y="142" fill="#8b949e" '
              f'font-family="monospace" font-size="11">'
              f'Past year • {total} contributions</text>'
          )
          svg.append('</svg>')

          os.makedirs("assets", exist_ok=True)
          with open("assets/contrib-heatmap.svg", "w", encoding="utf-8") as file:
              file.write("\n".join(svg) + "\n")

          print(f"Generated heatmap for {username}: {total} contributions")
          PY

      
      
      
      
      
      - name: Commit updated heatmap
        shell: bash
        run: |
          cp assets/contrib-heatmap.svg /tmp/contrib-heatmap.svg

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/contrib-heatmap.svg assets/contrib-heatmap.svg

          if git diff --quiet -- assets/contrib-heatmap.svg; then
            echo "Contribution heatmap is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add assets/contrib-heatmap.svg
          git commit -m "Update contribution heatmap"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Heatmap updated successfully."
              exit 0
            fi

            echo "Push attempt $attempt failed; syncing with main..."
            git fetch origin main
            git rebase origin/main || exit 1
          done

          echo "Push failed after 3 attempts."
          exit 1
